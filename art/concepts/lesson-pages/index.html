  .arena::after { content: ''; position: absolute; inset: 0; background: linear-gradient(#0008, #0003 30%, #0002 70%, #0007); }
  .topbar { position: absolute; left: 0; right: 0; top: 0; height: 32px; z-index: 3; }
  .hearts { position: absolute; left: 12px; top: 9px; color: #d9534f; font-size: 11px; letter-spacing: 1px; }
  .track { position: absolute; left: 50%; top: 3px; transform: translateX(-50%); display: flex; gap: 14px; }
  .track span { width: 26px; height: 26px; border-radius: 5px; border: 1px solid #5d6f9a; background: #1d2740; overflow: hidden; }
  .track span.foe { border-color: #9a5050; background: #3a1d1d; }
  .track img { width: 26px; height: 26px; }
  .menu { position: absolute; right: 10px; top: 4px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid #ffffff33; }

  .plate { position: absolute; width: 140px; z-index: 2; }
  .plate .nm { text-align: center; font: 700 11.5px/1 ui-sans-serif, system-ui; color: #f2ecdc; margin-bottom: 4px; text-shadow: 0 1px 2px #000; }
  .plate .nm small { font-size: 8px; color: #b9b2a2; margin-right: 3px; }
  .meter { position: relative; height: 14px; background: #1d1f24; border: 1px solid #0009; margin-bottom: 2px; overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .7s ease-out; }
  .meter.hp i { background: linear-gradient(#5fc47c, #3f9a5a); }
  .meter.mp i { background: linear-gradient(#5aa0e6, #3a78bb); }
  .meter b { position: absolute; inset: 0; text-align: center; font: 700 8.5px/14px ui-sans-serif, system-ui; color: #fff; text-shadow: 0 1px 1px #000a; }
  .meter.hp .hatch { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, #d9534f 0 3px, #8e2f2c 3px 6px); opacity: 0; transition: opacity .3s; }
  .meter.hp.pred .hatch { opacity: 1; }

  .badge { position: absolute; width: 24px; height: 22px; border-radius: 4px; display: grid; place-items: center; z-index: 2; box-shadow: 0 1px 2px #0008; }
  .badge svg { width: 15px; height: 15px; }
  .fig { position: absolute; width: 96px; height: 96px; z-index: 1; transition: transform .25s ease-out, opacity .5s, filter .1s; }
  .fig img { width: 96px; height: 96px; }
  .fig.foe img { transform: scaleX(-1); }
  .fig.small, .fig.small img { width: 72px; height: 72px; }
  .shadow { position: absolute; width: 84px; height: 16px; border-radius: 50%; background: #0007; z-index: 0; }
  .vs { position: absolute; left: 0; right: 0; top: 220px; text-align: center; font: 700 10px/1 ui-sans-serif; color: #ffffff44; letter-spacing: .2em; z-index: 1; }
  .fig.lunge { transform: translate(18px, -26px); }
  .fig.flash { filter: brightness(3.2); }
  .fig.gone { opacity: 0; transform: translateY(14px); }
  .fig.cast { filter: drop-shadow(0 0 10px #c356d0) brightness(1.3); }
  .fig.rested { filter: drop-shadow(0 0 12px #7fd4ff) brightness(1.25); }

  .bracket { position: absolute; z-index: 2; opacity: 0; transition: opacity .3s;
    border: 2px solid transparent; border-image: linear-gradient(var(--gold), var(--gold)) 1;
    -webkit-mask: conic-gradient(at 18px 18px, transparent 75%, #000 0) 0 0 / calc(100% - 18px) calc(100% - 18px); }
  .bracket.on { opacity: 1; }

  .num { position: absolute; z-index: 4; font: 900 22px/1 ui-sans-serif, system-ui; color: #fff; -webkit-text-stroke: 1px #000; text-shadow: 0 2px 0 #000;
    opacity: 0; transform: translateY(0); pointer-events: none; }
  .num.pop { animation: num 1.3s ease-out forwards; }
  .num.big { font-size: 32px; color: #ffd36a; }
  @keyframes num { 0% { opacity: 0; transform: translateY(6px) scale(.6); } 15% { opacity: 1; transform: translateY(-8px) scale(1.15); } 30% { transform: translateY(-12px) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }
  .burst { position: absolute; z-index: 3; border-radius: 50%; opacity: 0; pointer-events: none; }
  .burst.pop { animation: burst .6s ease-out forwards; }
  @keyframes burst { 0% { opacity: 0; transform: scale(.2); } 25% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.5); } }

  /* ---- the strip, the console, the footer ---- */
  .strip { position: absolute; left: 0; right: 0; top: 452px; height: 28px; z-index: 2;
    background: linear-gradient(#2a2c33, #1a1b20); border-top: 2px solid #8a6d36; border-bottom: 2px solid #8a6d36; }
  .strip .who { position: absolute; top: 0; height: 24px; display: flex; align-items: center; gap: 8px; font: 700 10px/1 ui-sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .strip .who.l { left: 4px; color: #e9dcc0; }
  .strip .who.r { right: 4px; color: #8f8a7c; }
  .strip .who img { width: 22px; height: 22px; border: 1px solid #5b4a33; background: #111; }
  .console { position: absolute; left: 0; right: 0; top: 480px; height: 242px;
    background: linear-gradient(#0009, #0006), url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAA/0lEQVR4nOWWwQrCMAyG+wB68SgKIiroxZPv/2hKhYyYNWnSpoTiIcOxmX38f5Imbba7d2SkfLk9Xm5hzbcA7A+XJc7X58+9JSDf8XT/Rs4Fv0tRBOiBoQBS5NxVAE1gyBIAVoEqorZAUqIGoLIAkuBkWvldAHosaKkBsKIbgKrkpgAnf82WaSz4H4DmSahpwdI7YQoADJ4r4RYAhASTwveBUee89v9Jkgc/67WKq42krVYvgFUNjACwtOecCtDdQTO0uE3JDNC6sKoV4LpieBfU2tGzBvC3RAusc0Cyhzslh3cBPaTmaUNaE1YAzbK6akOpEMMGEUBJAC2DCPJ+AAWedRB/ve0eAAAAAElFTkSuQmCC) 0 0 / 64px 64px repeat; image-rendering: pixelated; }
  .moves, .targets { position: absolute; inset: 0; transition: opacity .25s; }
  .targets { opacity: 0; pointer-events: none; }
  .console.targeting .moves { opacity: 0; }
  .console.targeting .targets { opacity: 1; }
  .move { position: absolute; left: 14px; right: 14px; height: 100px; border-radius: 4px; display: flex; align-items: center;
    background: linear-gradient(90deg, rgba(var(--t), .28), rgba(var(--t), .05) 40%, transparent 70%), linear-gradient(#1b1d24, #14161b);
    border: 1px solid #2c2f38; box-shadow: inset 0 2px 0 #0008, inset 0 -1px 0 #ffffff14; transition: box-shadow .2s, filter .3s, opacity .3s; }
  .move::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 4px; background: rgb(var(--t)); box-shadow: 0 0 10px rgb(var(--t)); }
  .move .hex { width: 38px; height: 42px; margin-left: 18px; display: grid; place-items: center; font: 800 15px/1 ui-sans-serif; color: #eaf2ff;
    background: #24385a; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); position: relative; }
  .move .hex::after { content: ''; position: absolute; inset: 2px; clip-path: inherit; background: radial-gradient(#3a5a90, #1c2c48); z-index: -1; }
  .move .kind { width: 16px; height: 16px; margin-left: 12px; opacity: .8; }
  .move .name { margin-left: 8px; font: 700 18px/1 ui-sans-serif, system-ui; color: #f2ecdc; flex: 1; }
  .move .pow { width: 54px; align-self: stretch; margin: 2px; display: grid; place-items: center; font: 800 20px/1 ui-sans-serif; color: #f2ecdc;
    background: linear-gradient(#5a2a24, #3a1b18); border-left: 1px solid #0008; }
  .move .pow.shield { background: linear-gradient(#22494a, #163334); }
  .move.lit { box-shadow: 0 0 0 2px var(--gold), 0 0 18px #e8c46a77; }
  .move.dead { filter: grayscale(1) brightness(.6); }
  .move.dead .hex { background: #6a2020; color: #ffb4b4; }
  .tcard { position: absolute; top: 14px; width: 176px; height: 214px; border: 1px solid #3a3d47; background: linear-gradient(#1b1d24cc, #121318cc); transition: box-shadow .2s; }
  .tcard.lit { box-shadow: 0 0 0 2px var(--gold), 0 0 18px #e8c46a77; }
  .tcard .badge { left: 6px; top: 6px; }
  .tcard .fig { left: 52px; top: 50px; }
  .tcard .glow { position: absolute; left: 30px; right: 30px; top: 104px; height: 26px; border-radius: 50%; }
  .tcard .range { position: absolute; left: 50%; top: 132px; transform: translateX(-50%); padding: 3px 8px; border-radius: 9px; background: #0c0d10; border: 1px solid #3a3d47;
    font: 800 10px/1 ui-sans-serif; color: #f2ecdc; white-space: nowrap; transition: box-shadow .3s, transform .3s; }
  .tcard .range.hot { color: #ffd36a; border-color: var(--gold); box-shadow: 0 0 12px #e8c46aaa; transform: translateX(-50%) scale(1.25); }
  .tcard .plate { left: 2px; right: 2px; width: auto; top: 152px; }
  .back { position: absolute; left: 12px; right: 12px; top: 250px; height: 44px; border-radius: 22px; border: 2px solid #8a6d36; display: grid; place-items: center;
    font: 800 13px/1 ui-sans-serif; letter-spacing: .12em; color: #f0e2bd; background: #0c0d10; }
  .footer { position: absolute; left: 0; right: 0; top: 722px; height: 58px; background: linear-gradient(#17181c, #0c0d10); border-top: 1px solid #3a3020; z-index: 2; transition: opacity .25s; }
  .console.targeting ~ .footer { opacity: 0; }
  .fb { position: absolute; top: 6px; width: 70px; text-align: center; font: 800 8.5px/1 ui-sans-serif; letter-spacing: .12em; color: #6f6a5e; }
  .fb i { display: block; width: 32px; height: 32px; margin: 0 auto 5px; border-radius: 50%; border: 2px solid #3a3d47; background: #1a1c22; transition: all .25s; }
  .fb.on { color: #f0e2bd; }
  .fb.on i { border-color: #7fd4ff; background: #22394d; box-shadow: 0 0 14px #7fd4ffaa; }
  .fb.dim { opacity: .45; }

  /* ---- the lesson's own layer ---- */
  .ribbon { position: absolute; left: 0; right: 0; top: 0; height: 32px; z-index: 5; padding: 0 18px; text-align: center; font: 16px/32px Georgia, serif; color: #f6ebcf;
    background: linear-gradient(90deg, #0b0d12f2, #0b0d12f2); border-top: 0; border-bottom: 1px solid #e8c46a66;
    transition: opacity .4s; }
  .ribbon.off { opacity: 0; }
  .finger { position: absolute; z-index: 9; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    background: radial-gradient(#ffffffee 0 35%, #ffffff55 36% 60%, transparent 61%); box-shadow: 0 2px 6px #0008;
    transition: left .6s cubic-bezier(.4,0,.2,1), top .6s cubic-bezier(.4,0,.2,1), opacity .3s, transform .12s; opacity: 0; }
  .finger.on { opacity: 1; }
  .finger.down { transform: scale(.8); }
  .finger::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #fff; opacity: 0; }
  .finger.down::after { animation: ring .5s ease-out; }
  @keyframes ring { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2); } }
  .yourturn { position: absolute; left: 0; right: 0; bottom: 0; top: 722px; z-index: 6; display: grid; place-items: center; font: 800 12px/1 ui-sans-serif; letter-spacing: .2em;
    color: var(--gold); background: #0c0d10; opacity: 0; transition: opacity .4s; }
  .yourturn.on { opacity: 1; animation: breathe 1.6s infinite; }
  @keyframes breathe { 50% { color: #8a6d36; } }

  .ctl { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .ctl button { background: #1a1d25; color: var(--gold); border: 1px solid #6b5a33; padding: 6px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
</style>
</head>

<h1>LESSON PAGES · ON THE FIELD</h1>
<p class="sub">The lesson opens on its own fight, laid out exactly as a fight is. A ghost finger plays the concept once with one line over the field, then the screen says "Your turn" and the same fight goes live. Each phone loops.</p>

  }
  h += `<div class="bracket" id="brL" style="left:12px;top:30px;width:184px;height:190px"></div>
    <div class="bracket" id="brR" style="left:200px;top:30px;width:184px;height:190px"></div>
    <div class="strip"><div class="who l"><img class="px" src="${A[u.heroL.art]}">${u.heroL.name}</div><div class="who r">${u.heroR.name}<img class="px" src="${A[u.heroR.art]}"></div></div>
    <div class="console" id="con"><div class="moves">`;
  L.moves.forEach((m, i) => {
    h += `<div class="move" id="mv${i}" style="--t:${RGB[m.type]};top:${16 + i * 110}px"><div class="hex">${m.cost}</div>
      <img class="kind px" src="${A[m.kind]}"><div class="name">${m.name}</div><div class="pow">${m.pow}</div></div>`;
  });
  h += `</div><div class="targets">`;
  for (const [k, x] of [['foeL', 18], ['foeR', 200]]) {
    const f = u[k], t = L.targets[k];
    h += `<div class="tcard" id="tc_${k}" style="left:${x}px">${badge(f.type)}
      <div class="glow" style="background:radial-gradient(${TC[f.type]}88, transparent 70%)"></div>
      <div class="fig foe" style="left:40px;top:34px"><img class="px" src="${A[f.art]}"></div>
      <div class="range" id="rg_${k}">${t.range}</div>
      ${plate('tp_' + k, f, 2, 152).replace('class="meter hp"', 'class="meter hp pred"').replace('<span class="hatch"></span>', `<span class="hatch" style="left:${Math.max(0, (f.hp - t.dmg) / f.hpMax * 100)}%;width:${Math.min(f.hp, t.dmg) / f.hpMax * 100}%"></span>`)}
    </div>`;
  }
  h += `<div class="back">← BACK</div></div></div>
    <div class="footer">${['BACK', 'SWITCH', 'REST', 'BAG'].map((l, i) => `<div class="fb ${i === 0 ? 'dim' : ''}" id="fb${l}" style="left:${[20, 115, 205, 303][i]}px"><i></i>${l}</div>`).join('')}</div>
    <div class="yourturn" id="yt">YOUR TURN</div>
    <div class="ribbon" id="rib">${L.line}</div>
    <div class="finger" id="fg"></div>`;
  return h;
}

function run(screen, L) {
  let timers = [];
  const $ = id => screen.querySelector('#' + id);
  const cls = (id, c, on = true) => $(id) && $(id).classList.toggle(c, on);
  const finger = (x, y) => { const f = $('fg'); f.style.left = x + 'px'; f.style.top = y + 'px'; f.classList.add('on'); };
  const tap = () => { const f = $('fg'); f.classList.add('down'); setTimeout(() => f.classList.remove('down'), 300); };
  const setMeter = (pid, kind, val, max) => { const m = $(pid).querySelector('.meter.' + kind); m.querySelector('i').style.width = val / max * 100 + '%'; m.querySelector('b').textContent = `${kind.toUpperCase()} ${val}/${max}`; };
  const hit = (k, dmg, big, burst) => {
    cls(k, 'flash'); setTimeout(() => cls(k, 'flash', false), 120);
    const n = $(k + 'N'); n.textContent = dmg; n.className = 'num pop' + (big ? ' big' : '');
    if (burst) { const b = $(k + 'B'); b.style.background = burst; b.className = 'burst pop'; }
  };
  const ctx = { $, cls, finger, tap, setMeter, hit };
  const loop = () => {
    timers.forEach(clearTimeout); timers = [];
    screen.innerHTML = build(L);
    for (const [t, fn] of L.steps) timers.push(setTimeout(() => fn(ctx), t));
    timers.push(setTimeout(loop, L.length));
  };
  loop();
  return loop;
}
