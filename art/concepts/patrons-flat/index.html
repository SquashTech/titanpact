<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patron Looks</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
    <style>
      html, body { overflow: auto; height: auto; margin: 0; }
      body { background: #9bd86a; color: #2b2340; font-family: 'Fredoka', sans-serif; }
      .pf { padding: 16px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      section { margin-bottom: 16px; padding: 12px 14px; border-radius: 18px; background: rgba(255, 250, 240, 0.35); }
      h2 { margin: 0 0 2px; font-size: 18px; }
      section p { margin: 0 0 10px; font-size: 13px; max-width: 620px; }
      .strip { display: flex; flex-wrap: wrap; gap: 18px; align-items: end; }
      .cell { display: grid; justify-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
      .big { width: 144px; height: 144px; }
      .px { image-rendering: pixelated; }
      .sticker { filter: drop-shadow(2px 0 0 #fffaf0) drop-shadow(-2px 0 0 #fffaf0) drop-shadow(0 2px 0 #fffaf0) drop-shadow(0 -2px 0 #fffaf0) drop-shadow(2px 0 0 #2b2340) drop-shadow(-2px 0 0 #2b2340) drop-shadow(0 2px 0 #2b2340) drop-shadow(0 -2px 0 #2b2340); }
      .disc { width: 76px; height: 76px; border-radius: 50%; background: #fffaf0; border: 3.5px solid #2b2340; box-shadow: 0 4px 0 #c7ccd6; display: grid; place-items: center; overflow: visible; }
      .disc img { width: 60px; height: 60px; margin-top: -10px; }
      .disc .sticker { width: 54px; height: 54px; }
      .tower img { width: 176px; height: 176px; }
      .hero { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="pf" id="root"></div>
    <script type="module">
      const ids = ['swordsman', 'archmage', 'headmaster', 'huntress', 'priest', 'hexwright', 'forgemistress'];
      const OPTIONS = [
        { name: 'Now · Pixel', note: 'The patrons as they are: darker, grimmer pixel art than the heroes.', src: (i) => `./pixel/patron-${i}.png`, cls: 'px' },
        { name: 'A · Pixel sticker', note: 'The same sprites, cut out with a cream rim and an ink line, so they sit on the storybook UI like the buttons do. No redraw.', src: (i) => `./pixel/patron-${i}.png`, cls: 'px sticker' },
        { name: 'B · Cartoony pixel', note: 'Redrawn in the heroes’ own current style (Ronin as the reference): brighter, bolder outline, still adult proportions and a cool stance. In the game since 2026-11-27.', src: (i) => `./cartoony/patron-${i}.png`, cls: 'px' },
        { name: 'B · Cartoony poses', note: 'Their entrance poses.', src: (i) => `./cartoony/poses/${i}.png`, cls: 'px' },
        { name: 'Flat (taken out)', note: 'The vector chibi set, for reference.', src: (i) => `./flat/patron-${i}.svg`, cls: '' },
      ];
      const big = (src, cls, label) => `<div class="cell"><img class="big ${cls}" src="${src}">${label}</div>`;
      const disc = (src, cls) => `<div class="cell"><span class="disc"><img class="${cls}" src="${src}"></span>on the road</div>`;
      const hero = `<div class="cell hero"><img class="big px" src="../../heroes/unlocks/ronin.png">a hero (Ronin)</div>`;
      document.getElementById('root').innerHTML =
        '<h1>Patron looks</h1>' +
        OPTIONS.map((o) => `<section><h2>${o.name}</h2><p>${o.note}</p><div class="strip">${ids.map((i) => big(o.src(i), o.cls, i)).join('')}${disc(o.src(ids[0]), o.cls)}${hero}</div></section>`).join('') +
        `<section class="tower"><h2>Tower</h2><div class="strip"><div class="cell"><img src="./tower-old.svg">First flat</div><div class="cell"><img src="./tower-round.svg">A · Round (in the game)</div><div class="cell"><img src="./tower-keep.svg">B · Keep</div></div></section>`;
    </script>
  </body>
</html>
