<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Light Climb</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --text: #e9dcc0; --dim: #8f8a7c; --gold: #e8c46a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 48px; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif; }
  h1 { text-align: center; font: 700 18px/1.2 Georgia, serif; letter-spacing: .12em; margin: 0 0 6px; color: #f0e2bd; }
  .sub { text-align: center; color: var(--dim); margin: 0 auto 18px; max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; }
  .col { width: 315px; }
  .col h2 { margin: 0 0 2px; font-size: 15px; letter-spacing: .04em; }
  .col p { margin: 0 0 10px; color: var(--dim); min-height: 112px; }
  .ctl { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .ctl button { background: #1a1d25; color: var(--gold); border: 1px solid #6b5a33; padding: 6px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
  .phone { width: 315px; height: 624px; overflow: hidden; border-radius: 14px; border: 1px solid #262a33; position: relative; }
  .screen { width: 394px; height: 780px; transform: scale(.8); transform-origin: 0 0; position: relative; overflow: hidden; user-select: none; background: #07080d; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .scroll::-webkit-scrollbar { display: none; }
  .world { position: relative; width: 394px; }
  img.px { image-rendering: pixelated; }

  .logo { font: 900 44px/1 'Courier New', monospace; letter-spacing: .02em; text-align: center; color: #f6c35a;
    background: linear-gradient(#fff3c4 0 30%, #f2b84a 30% 65%, #b8761f 65%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 0 #3a2208) drop-shadow(0 0 14px #e8a84a66); }
  .blip { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(#fffbe8 0 45%, #ffe9a8 55%, #ffd36a00 72%); box-shadow: 0 0 22px #ffe39a99; z-index: 6; transition: top .8s ease, left .8s ease; }
  .blip::before, .blip::after { content: ''; position: absolute; top: 13px; width: 4px; height: 6px; border-radius: 2px; background: #3a2c1c; }
  .blip::before { left: 11px; } .blip::after { left: 19px; }
  .blip { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }

  .press { position: absolute; left: 60px; right: 60px; bottom: 26px; height: 54px; z-index: 8; display: grid; place-items: center;
    font: 800 14px/1 ui-sans-serif, system-ui; letter-spacing: .18em; color: #fff1c8; text-transform: uppercase;
    background: radial-gradient(ellipse at 50% 40%, #233056, #0c1022); border: 2px solid #c79a48; clip-path: polygon(4% 0, 100% 0, 100% 72%, 96% 100%, 0 100%, 0 28%); }
  .fade-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; z-index: 7; background: linear-gradient(transparent, #07080dee 60%); pointer-events: none; }

  /* an island */
  .isle { position: absolute; width: 150px; height: 120px; margin-left: -75px; cursor: pointer; }
  .isle .glow { position: absolute; left: 0; right: 0; top: 64px; height: 50px; border-radius: 50%; background: radial-gradient(#ffd36a55, transparent 70%); opacity: 0; transition: opacity .4s; }
  .isle .rock { position: absolute; left: 22px; right: 22px; top: 78px; height: 30px; border-radius: 0 0 50% 50% / 0 0 100% 100%; background: linear-gradient(#3b3550, #1a1726); clip-path: polygon(0 0, 100% 0, 80% 70%, 55% 100%, 30% 75%); }
  .isle .top { position: absolute; left: 20px; right: 20px; top: 70px; height: 20px; border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #4a4466, #2a2640); border: 1px solid #ffffff22; }
  .isle .cast { position: absolute; left: 0; right: 0; top: 14px; display: flex; justify-content: center; gap: 0; }
  .isle .cast img { width: 64px; height: 64px; margin: 0 -10px; }
  .isle .num { position: absolute; left: 0; right: 0; top: 108px; text-align: center; font: 700 11px/1 Georgia, serif; color: #8f8aa8; letter-spacing: .1em; }
  .isle .star { position: absolute; left: 50%; top: 92px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #cdd6ff88; }
  .isle.lit .top { background: radial-gradient(ellipse at 50% 40%, #ffe39a, #c79a48); border-color: #fff3c4; box-shadow: 0 0 14px #ffd36a88; }
  .isle.lit .glow { opacity: 1; }
  .isle.lit .star { background: #fff3cf; box-shadow: 0 0 10px #ffd36a; }
  .isle.lit .num { color: #e8c46a; }
  .isle.next .top { background: radial-gradient(ellipse at 50% 40%, #d8e2ff, #6a78b8); border-color: #fff; box-shadow: 0 0 18px #aab8ffaa; animation: breathe 2s ease-in-out infinite; }
  .isle.next .num { color: #fff; }
  .isle.dark .cast img { filter: brightness(0) opacity(.55); }
  .isle.dark .top { opacity: .6; }
  @keyframes breathe { 50% { box-shadow: 0 0 30px #c8d4ffee; } }
  svg.path { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  svg.path .dim { stroke: #cdd6ff2e; stroke-width: 2; stroke-dasharray: 3 7; fill: none; stroke-linecap: round; }
  svg.path .lit { stroke: #ffd27ae0; stroke-width: 2.5; fill: none; filter: drop-shadow(0 0 4px #ffc864); }

  /* the gate at the top */
  .gate { position: absolute; left: 50%; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%;
    background: radial-gradient(#cdbfa055 0, #4a3f7a55 30%, #1a1430 55%, transparent 70%); }
  .gate::before { content: ''; position: absolute; inset: 20px; border-radius: 50%; border: 1px solid #e8c46a66; }
  .gate::after { content: ''; position: absolute; inset: 90px; border-radius: 50%; border: 1px solid #e8c46a44; }

  /* A: night sky */
  .A .world { background: radial-gradient(ellipse at 50% 6%, #2a2650 0, #0b0c18 30%, #07080d 60%); }
  /* B: tower */
  .B .header { position: absolute; top: 0; left: 0; right: 0; height: 96px; z-index: 8; background: linear-gradient(#07080d 60%, transparent); display: grid; place-items: center; }
  .B .header .logo { font-size: 30px; }
  .B .beam { position: absolute; left: 50%; width: 4px; margin-left: -2px; background: linear-gradient(transparent, #ffd36a44 10%, #ffd36a22 90%, transparent); }
  .B .beam.lit { background: linear-gradient(#ffd36a00, #ffd36acc); filter: drop-shadow(0 0 6px #ffc864); }
  /* C: three skies */
  .C .band { position: absolute; left: 0; right: 0; }
  .stars { position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 20px 30px, #fff9 50%, transparent), radial-gradient(1px 1px at 120px 80px, #fff7 50%, transparent), radial-gradient(1px 1px at 260px 40px, #fff8 50%, transparent), radial-gradient(1.5px 1.5px at 330px 120px, #fffb 50%, transparent), radial-gradient(1px 1px at 70px 150px, #fff6 50%, transparent), radial-gradient(1px 1px at 200px 170px, #fff8 50%, transparent);
    background-size: 394px 190px; opacity: .8; }
</style>
</head>
<body>
<h1>FIRST LIGHT · THE CLIMB</h1>
<p class="sub">Ten islands in a sky you scroll. Each phone opens on the next lesson (V), with I–IV won below it and VI–X waiting in shadow above. Scroll inside a phone to climb.</p>

const CAST = [['crag', 'ursa'], ['riptide'], ['cinder', 'raiju'], ['cairn'], ['skyshear', 'hush'], ['marrow', 'crag'], ['crimson'], ['warden', 'rime'], ['clockwork'], ['nightshade', 'solace', 'pixie']];
const NUM = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
const LIT = 4;
const state = (i) => (i < LIT ? 'lit' : i === LIT ? 'next' : 'dark');

function isle(i, x, y) {
  return `<div class="isle ${state(i)}" style="left:${x}px;top:${y - 92}px"><div class="glow"></div><div class="rock"></div><div class="top"></div>
    <div class="cast">${CAST[i].map((k) => `<img class="px" src="${A[k]}">`).join('')}</div><div class="star"></div><div class="num">${NUM[i]}</div></div>`;
}
function path(pts, W, H, curve) {
  let d = '', lit = '';
  for (let i = 1; i < pts.length; i++) {
    const [a, b] = [pts[i - 1], pts[i]];
    const seg = curve ? `M ${a[0]} ${a[1]} C ${a[0]} ${(a[1] + b[1]) / 2}, ${b[0]} ${(a[1] + b[1]) / 2}, ${b[0]} ${b[1]}` : `M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}`;
    if (i <= LIT) lit += seg + ' '; else d += seg + ' ';
  }
  return `<svg class="path" width="${W}" height="${H}"><path class="dim" d="${d}"/><path class="lit" d="${lit}"/></svg>`;
}

const LAYOUTS = [
  {
    key: 'A', title: 'A · The climb to the Pact',
    blurb: 'One tall night sky. The islands zigzag up from the foot of the scroll to the Pact\'s ring at the very top, with the logo above it, so the title is where the climb ends. Blip waits beside the next island, and the press stays pinned at the foot.',
    build() {
      const STEP = 150, top = 520, H = top + 9 * STEP + 260;
      const pts = CAST.map((_, i) => [i % 2 ? 278 : 116, H - 220 - i * STEP]);
      let h = `<div class="world" style="height:${H}px"><div class="stars" style="height:${H}px"></div>
        <div class="logo" style="position:absolute;left:0;right:0;top:70px">TITANPACT</div>
        <div class="gate" style="top:150px"></div>`;
      h += path([...pts, [197, 410]], 394, H, true) + pts.map(([x, y], i) => isle(i, x, y)).join('');
      const n = pts[LIT];
      h += `<div class="blip" style="left:${n[0] + (n[0] < 197 ? 70 : -104)}px;top:${n[1] - 90}px"></div></div>`;
      return { html: h + '<div class="fade-foot"></div><div class="press">Next Lesson</div>', focus: n[1] - 420 };
    },
  },
  {
    key: 'B', title: 'B · The tower of light',
    blurb: 'A pinned header with a small logo, and Blip in it. The islands stack straight up one beam of light, which burns gold as far as you have climbed. Calmer and more readable at the cost of the zigzag\'s sense of journey; the Pact\'s gate caps the beam.',
    build() {
      const STEP = 140, H = 260 + 9 * STEP + 380;
      const pts = CAST.map((_, i) => [197, H - 200 - i * STEP]);
      const litTop = pts[LIT - 1][1];
      let h = `<div class="world" style="height:${H}px;background:linear-gradient(#1c1838 0, #0b0c18 25%, #07080d 70%)"><div class="stars" style="height:${H}px"></div>
        <div class="gate" style="top:110px"></div>
        <div class="beam" style="top:250px;height:${H - 450}px"></div><div class="beam lit" style="top:${litTop}px;height:${H - 200 - litTop}px"></div>`;
      h += pts.map(([x, y], i) => isle(i, x, y)).join('') + '</div>';
      return { html: h + '<div class="header"><div class="logo">TITANPACT</div></div><div class="blip" style="left:20px;top:30px"></div><div class="fade-foot"></div><div class="press">Next Lesson</div>', focus: pts[LIT][1] - 430 };
    },
  },
  {
    key: 'C', title: 'C · Three skies',
    blurb: 'The climb passes through three skies, with no words on them. Dusk holds I–IV, the fight basics. Deep night holds V–VIII, the doubles depth. The aurora holds IX–X, the run. The colour tells you how far you\'ve come, and the Pact\'s ring and logo sit above the last sky.',
    build() {
      const STEP = 150, H = 520 + 9 * STEP + 260;
      const pts = CAST.map((_, i) => [[110, 284, 140, 270][i % 4], H - 220 - i * STEP]);
      const y = (i) => pts[i][1];
      let h = `<div class="world" style="height:${H}px">
        <div class="band" style="top:${y(3) - 90}px;bottom:0;background:linear-gradient(#2b1d3c, #5a3346 55%, #8a5a4a)"></div>
        <div class="band" style="top:${y(7) - 90}px;height:${y(3) - y(7)}px;background:linear-gradient(#0a0c1c, #141a36 60%, #2b1d3c)"><div class="stars"></div></div>
        <div class="band" style="top:0;height:${y(7) - 90}px;background:linear-gradient(#07080d 0, #0d1a26 35%, #12403e 70%, #0a0c1c)"><div class="stars"></div></div>
        <div class="logo" style="position:absolute;left:0;right:0;top:70px">TITANPACT</div><div class="gate" style="top:150px"></div>`;
      h += path([...pts, [197, 410]], 394, H, true) + pts.map(([x, yy], i) => isle(i, x, yy)).join('');
      const n = pts[LIT];
      h += `<div class="blip" style="left:${n[0] + (n[0] < 197 ? 70 : -104)}px;top:${n[1] - 90}px"></div></div>`;
      return { html: h + '<div class="fade-foot"></div><div class="press">Next Lesson</div>', focus: n[1] - 420 };
    },
  },
];

const row = document.getElementById('row');
for (const L of LAYOUTS) {
  const col = document.createElement('div');
  col.className = 'col ' + L.key;
  col.innerHTML = `<h2>${L.title}</h2><p>${L.blurb}</p><div class="phone"><div class="screen"></div></div>
    <div class="ctl"><button data-to="foot">Foot</button><button data-to="next">Next lesson</button><button data-to="top">Top</button></div>`;
  row.appendChild(col);
  const screen = col.querySelector('.screen');
  const built = L.build();
  screen.innerHTML = `<div class="scroll">${built.html.split('<div class="fade-foot">')[0]}</div>` + built.html.slice(built.html.indexOf('<div class="fade-foot">'));
  const fixedTail = built.html.indexOf('<div class="header">');
  if (fixedTail >= 0) {
    const scroll = screen.querySelector('.scroll');
    scroll.innerHTML = built.html.slice(0, fixedTail);
    screen.insertAdjacentHTML('beforeend', built.html.slice(fixedTail, built.html.indexOf('<div class="fade-foot">')));
  }
  const scroll = screen.querySelector('.scroll');
  scroll.style.scrollBehavior = 'auto';
  scroll.scrollTop = built.focus;
  scroll.style.scrollBehavior = '';
  col.querySelectorAll('.ctl button').forEach((b) => (b.onclick = () => {
    scroll.scrollTop = b.dataset.to === 'top' ? 0 : b.dataset.to === 'foot' ? scroll.scrollHeight : built.focus;
  }));
}
</script>
