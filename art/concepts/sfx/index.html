<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Restyle</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f1e4;color:#2b2620;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.page{max-width:980px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:24px;margin:0 0 16px}
.row{background:#fffdf7;border:3px solid #2b2620;border-radius:18px;padding:14px;margin:0 0 14px}
.row h2{font-size:17px;margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
button{font:inherit;text-align:left;border:3px solid #2b2620;border-radius:14px;padding:10px 12px;cursor:pointer;background:#fff;color:#2b2620}
button b{display:block;font-size:15px}
button span{display:block;font-size:13px;color:#6b6152}
button.now{background:#e7e2d6}
button.a{background:#ffe2b8}
button.b{background:#cfeaff}
button:active{transform:translateY(2px)}
.extra{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.extra button{padding:6px 10px;font-size:13px}
.sweep{margin:0 0 18px;display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="page">
<h1>Sound Restyle</h1>
<div class="sweep" id="sweep"></div>
<div id="rows"></div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
