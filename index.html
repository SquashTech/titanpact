<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Deliberately NOT viewport-fit=cover. Going edge-to-edge hands the notch /
      status-bar strip to the viewport, and `.app-shell` is `position: fixed;
      top: 0` sized from JS-measured viewport height (src/app/uiScale.ts) — so
      cover both hid the top of the UI under the system clock and inflated the
      measured height the scaler derives the whole layout from. Letting the
      platform reserve its own bars keeps the installed app's viewport equal to
      the usable screen, which is what the scaler assumes.
    -->
    <!--
      minimum-scale=1.0 is load-bearing, not boilerplate. initial-scale pins the
      *starting* zoom and maximum-scale the *upper* bound, but neither sets a
      floor — so the floor is WebKit's default 0.25, and an installed iOS web
      app is free to settle at a zoom below 1 and remember it per site (which is
      why deleting and re-adding the home-screen icon does not reset it).

      At zoom 0.5 an iPhone reporting screen 390x844 hands the page a 780x1594
      layout viewport. Nothing errors: `.app-shell` correctly caps itself at
      MAX_WIDTH and centres, so the game renders half-size in a narrow column
      with --bg either side. Pinning the floor to 1 makes the layout viewport
      equal the device width on every device, which is what uiScale.ts measures.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Titanpact</title>
    <meta name="description" content="Piloted doubles tactical roguelike. Draft. Battle. Ascend." />

    <!-- Installed-app metadata. theme-color paints the Android system bars to
         match --bg so the shell doesn't frame the game in white. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS ignores the manifest for home-screen launches and reads these. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": translucent is the iOS half of
         viewport-fit=cover and puts the status bar *over* the shell. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Titanpact" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
